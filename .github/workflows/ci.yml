name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend – Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt ruff pytest-cov
      - name: Ruff lint
        run: ruff check . --exclude=.venv --exclude=alembic
      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing -q
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:////tmp/test_air_quality.db

  frontend:
    name: Frontend – Lint, Type-check, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: ESLint
        run: npm run lint
      - name: TypeScript check
        run: npx tsc -b --noEmit
      - name: Vitest
        run: npm test
      - name: Build
        run: npm run build

